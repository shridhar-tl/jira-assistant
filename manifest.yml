modules:
  jira:globalPage:
    - key: jira-assistant-app
      resource: main
      resolver:
        function: resolver
      title: Jira Assistant
      icon: https://app.jiraassistant.com/assets/icon_48.png
      layout: blank
  jira:dashboardGadget:
    - key: ja-date-wise-worklog
      title: Date wise worklog
      description: Lists the worklog details on daily basis for selected time period
      thumbnail: https://www.jiraassistant.com/images/gadgets/date-wise-worklog.png
      resource: main
      edit:
        resource: main
    - key: ja-worklog-timer
      title: Worklog timer
      description: A simple timer control to capture time spent on a ticket
      thumbnail: https://www.jiraassistant.com/images/gadgets/worklog-timer.png
      resource: main
    - key: ja-worklog-barchart
      title: Worklog Bar Chart
      description: Lets you visualize worklog plotted for individual issues via bar chart
      thumbnail: https://www.jiraassistant.com/images/gadgets/worklog-barchart.png
      resource: main
      edit:
        resource: main
    - key: ja-team-worklog
      title: Team Daywise Worklog
      description: Lets you visualize worklog for individual user based on sprint or
        date range
      thumbnail: https://www.jiraassistant.com/images/gadgets/teamwise-worklog.png
      resource: main
      edit:
        resource: main
  dashboards:widget:
    - key: ja-workload-heatmap
      title: Workload Heatmap
      description: Shows the estimated work planned for each team member per day against their daily capacity
      thumbnail: https://app.jiraassistant.com/assets/icon_48.png
      resource: main
      edit:
        resource: main
    - key: ja-time-in-status
      title: Time in Status
      description: Shows how long issues spend in each status and highlights the bottleneck in your workflow
      thumbnail: https://app.jiraassistant.com/assets/icon_48.png
      resource: main
      edit:
        resource: main
  jira:issueGlance:
    - key: ja-issue-glance
      title: Worklog timer
      label: View time tracker
      resource: main
      icon: https://app.jiraassistant.com/assets/icon_24.png
  trigger:
    - key: sprint-started-trigger
      function: sprint-started-handler
      events:
        - avi:jira-software:started:sprint
        - avi:jira-software:closed:sprint
      filter:
        ignoreSelf: true
        onError: RECEIVE_AND_LOG
  function:
    - key: sprint-started-handler
      handler: jcloud-events.onSprintAction
    - key: resolver
      handler: jcloud.handler
      providers:
        auth:
          - mso
resources:
  - key: main
    path: dist
    tunnel:
      port: 6060
permissions:
  content:
    styles:
      - unsafe-inline
  external:
    images:
      - address: "*.atlassian.net"
    fetch:
      backend:
        - address: https://login.microsoftonline.com
        - address: https://graph.microsoft.com
      client:
        - address: graph.microsoft.com
  scopes:
    - storage:app
    - read:jira-user
    - read:sprint:jira-software
    - read:issue-details:jira
    - read:jql:jira
    - read:jira-work
    - read:board-scope:jira-software
    - read:project:jira
    - read:issue-meta:jira
    - read:avatar:jira
    - read:board-scope.admin:jira-software
    - read:issue.changelog:jira
    - write:jira-work
    - write:sprint:jira-software
app:
  id: ari:cloud:ecosystem::app/3864d3bc-aad3-4650-ac35-e15af61fd92d
  runtime:
    name: nodejs24.x
  storage:
    entities:
      - name: poker-room
        attributes:
          roomId:
            type: string
          roomName:
            type: string
          scoreType:
            type: integer
          moderatorId:
            type: string
          moderatorKey:
            type: string
          currentIssueId:
            type: string
          issues:
            type: any
          settings:
            type: any
          access:
            type: any
          listed:
            type: string
          memberCount:
            type: integer
          created:
            type: string
          lastActivity:
            type: float
          lastActivityIso:
            type: string
          refreshedMs:
            type: float
          ver:
            type: integer
        indexes:
          - name: by-listed
            partition:
              - listed
            range:
              - lastActivity
      - name: poker-counter
        attributes:
          roomId:
            type: string
          revision:
            type: integer
      - name: poker-participant
        attributes:
          kind:
            type: string
          roomId:
            type: string
          memberKey:
            type: string
          ownerKey:
            type: string
          status:
            type: string
          roomGroup:
            type: string
          name:
            type: string
          email:
            type: string
          avatarId:
            type: any
          avatarUrl:
            type: string
          createdAt:
            type: string
          createdMs:
            type: float
          sid:
            type: string
          role:
            type: string
          joinedAt:
            type: string
          lastSeenAt:
            type: string
          lastSeenMs:
            type: float
          votedIssueIds:
            type: any
          requestId:
            type: string
          reason:
            type: string
          invitedBy:
            type: string
          members:
            type: any
          ver:
            type: integer
        indexes:
          - name: by-room-group
            partition:
              - roomGroup
            range:
              - createdMs
          - name: by-person
            partition:
              - memberKey
            range:
              - createdMs
      - name: poker-vote
        attributes:
          kind:
            type: string
          roomId:
            type: string
          issueId:
            type: string
          sid:
            type: string
          value:
            type: any
          reveal:
            type: boolean
          createdAt:
            type: string
          revealedAt:
            type: string
          average:
            type: float
          maxVote:
            type: float
          finalScore:
            type: any
          syncedScore:
            type: any
          values:
            type: any
remotes:
  - key: mso-account
    baseUrl: https://login.microsoftonline.com
  - key: ms-apis
    baseUrl: https://graph.microsoft.com
providers:
  auth:
    - key: mso
      name: MicrosoftOutlook
      scopes:
        - 'Calendars.Read'
        - 'profile'
        - 'offline_access'
        - 'openid'
      type: oauth2
      clientId: a8efd8fc-0657-490e-a622-7b2aaa4f4f46
      remotes:
        - ms-apis
      bearerMethod: authorization-header
      actions:
        authorization:
          remote: mso-account
          path: /common/oauth2/v2.0/authorize
        exchange:
          remote: mso-account
          path: /common/oauth2/v2.0/token
        retrieveProfile:
          remote: ms-apis
          path: /beta/me/profile
          resolvers:
            id: id
            displayName: names.0.displayName

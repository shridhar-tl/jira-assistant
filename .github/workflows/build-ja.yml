name: Build & Deploy JA

on:
  workflow_dispatch:
  push:
    branches: [ package ]
    paths-ignore:
      - '**/package-lock.json'
      - '**/npm-shrinkwrap.json'
      - '**/pnpm-lock.yaml'
      - 'docs/**'
      - 'scripts/**'
  pull_request:
    branches: [ package ]
    paths-ignore:
      - '**/package-lock.json'
      - '**/npm-shrinkwrap.json'
      - '**/pnpm-lock.yaml'
      - 'docs/**'
      - 'scripts/**'

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      CI: ""
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      src_name: ${{ steps.prepare_source.outputs.src_name }}

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install packages
      run: |
        rm -f package-lock.json
        npm install --force
    - name: Extract version
      id: extract_version
      uses: Saionaro/extract-package-version@v1.4.0
    - run: npm run build-web
    - run: git config --global user.name 'GitHub Web Deploy CI'
    - run: git config --global user.email 'shridhar.tl@gmail.com'
    - run: git remote set-url origin https://shridhar-tl:${{ secrets.COMMIT_KEY }}@github.com/${{ github.repository }}
    - run: npm run deploy-web
    - run: npm run build
    - run: git push origin --delete  ja-extn
    - run: npm run publish-extn

    - name: Save build package
      uses: actions/upload-artifact@v7
      with:
        name: JA_Build_${{ steps.extract_version.outputs.version }}
        path: dist/

    - name: Package store builds
      env:
        JA_VERSION: ${{ steps.extract_version.outputs.version }}
      run: |
        PKG_DIR="$RUNNER_TEMP/ja-store"
        mkdir -p "$PKG_DIR"
        for BROWSER in chrome edge firefox opera; do
          (cd "dist/$BROWSER" && zip -r -X -q "$PKG_DIR/ja-$BROWSER-v$JA_VERSION.zip" .)
        done
        ls -l "$PKG_DIR"
        echo "PKG_DIR=$PKG_DIR" >> "$GITHUB_ENV"

    - name: Save store packages
      uses: actions/upload-artifact@v7
      with:
        name: JA_Store_Packages_${{ steps.extract_version.outputs.version }}
        path: ${{ env.PKG_DIR }}

    - name: Commit lock file
      if: github.ref == 'refs/heads/package'
      env:
        JA_VERSION: ${{ steps.extract_version.outputs.version }}
      run: |
        git add -f package-lock.json
        if git diff --cached --quiet; then
          echo "package-lock.json is unchanged"
        else
          git commit -m "Update package-lock.json with packages used for v$JA_VERSION build [skip ci]"
          git push origin HEAD:refs/heads/package || echo "::warning::Could not push package-lock.json to the package branch. The build tag still includes it."
        fi

    - name: Tag build
      if: github.ref == 'refs/heads/package'
      env:
        TZ: Asia/Kolkata
        JA_VERSION: ${{ steps.extract_version.outputs.version }}
      run: |
        TAG_NAME="JA_$(date +%Y%m%d)_v${JA_VERSION//./_}"
        git tag -f -a "$TAG_NAME" -m "Build v$JA_VERSION"
        git push -f origin "refs/tags/$TAG_NAME"
        echo "Created tag $TAG_NAME"

    - name: Prepare source package
      id: prepare_source
      env:
        JA_VERSION: ${{ steps.extract_version.outputs.version }}
      run: |
        SRC_DIR="$RUNNER_TEMP/ja-src"
        mkdir -p "$SRC_DIR"
        git archive HEAD | tar -x -C "$SRC_DIR"
        cp package-lock.json "$SRC_DIR/"
        rm -rf "$SRC_DIR/docs" "$SRC_DIR/.github" "$SRC_DIR/.mcp.json" "$SRC_DIR/README.md"
        if [ -f "$SRC_DIR/REVIEWERS_README.md" ]; then
          mv "$SRC_DIR/REVIEWERS_README.md" "$SRC_DIR/README.md"
        fi
        echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
        echo "SRC_NAME=JA_SRC_V${JA_VERSION//./_}" >> "$GITHUB_ENV"
        echo "src_name=JA_SRC_V${JA_VERSION//./_}" >> "$GITHUB_OUTPUT"

    - name: Save source package
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.SRC_NAME }}
        path: ${{ env.SRC_DIR }}
        include-hidden-files: true

  publish-chrome:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/package'
    runs-on: ubuntu-latest
    environment: store-release
    steps:
    - name: Check Chrome Web Store credentials
      id: creds
      env:
        CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
        CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
        CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
        CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      run: |
        MISSING=""
        for NAME in CHROME_EXTENSION_ID CHROME_PUBLISHER_ID CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN; do
          [ -n "${!NAME}" ] || MISSING="$MISSING $NAME"
        done
        if [ -n "$MISSING" ]; then
          echo "::notice title=Chrome Web Store skipped::Not configured in store-release environment:$MISSING"
          echo "configured=false" >> "$GITHUB_OUTPUT"
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Download store packages
      if: steps.creds.outputs.configured == 'true'
      uses: actions/download-artifact@v7
      with:
        name: JA_Store_Packages_${{ needs.build.outputs.version }}
        path: store

    - name: Checkout publish scripts
      if: steps.creds.outputs.configured == 'true'
      uses: actions/checkout@v7
      with:
        sparse-checkout: scripts/store-publish
        path: repo

    - name: Use Node.js 24.x
      if: steps.creds.outputs.configured == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 24.x

    - name: Publish to Chrome Web Store
      if: steps.creds.outputs.configured == 'true'
      env:
        PACKAGE_PATH: store/ja-chrome-v${{ needs.build.outputs.version }}.zip
        CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
        CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
        CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
        CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      run: node repo/scripts/store-publish/chrome.mjs

  publish-edge:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/package'
    runs-on: ubuntu-latest
    environment: store-release
    steps:
    - name: Check Edge Add-ons credentials
      id: creds
      env:
        EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
        EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
      run: |
        MISSING=""
        for NAME in EDGE_PRODUCT_ID EDGE_CLIENT_ID EDGE_API_KEY; do
          [ -n "${!NAME}" ] || MISSING="$MISSING $NAME"
        done
        if [ -n "$MISSING" ]; then
          echo "::notice title=Edge Add-ons skipped::Not configured in store-release environment:$MISSING"
          echo "configured=false" >> "$GITHUB_OUTPUT"
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Download store packages
      if: steps.creds.outputs.configured == 'true'
      uses: actions/download-artifact@v7
      with:
        name: JA_Store_Packages_${{ needs.build.outputs.version }}
        path: store

    - name: Checkout publish scripts
      if: steps.creds.outputs.configured == 'true'
      uses: actions/checkout@v7
      with:
        sparse-checkout: scripts/store-publish
        path: repo

    - name: Use Node.js 24.x
      if: steps.creds.outputs.configured == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 24.x

    - name: Publish to Edge Add-ons
      if: steps.creds.outputs.configured == 'true'
      env:
        PACKAGE_PATH: store/ja-edge-v${{ needs.build.outputs.version }}.zip
        EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
        EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
      run: node repo/scripts/store-publish/edge.mjs

  publish-firefox:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/package'
    runs-on: ubuntu-latest
    environment: store-release
    steps:
    - name: Check Firefox Add-ons credentials
      id: creds
      env:
        FIREFOX_ADDON_GUID: ${{ vars.FIREFOX_ADDON_GUID }}
        FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
        FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      run: |
        MISSING=""
        for NAME in FIREFOX_ADDON_GUID FIREFOX_JWT_ISSUER FIREFOX_JWT_SECRET; do
          [ -n "${!NAME}" ] || MISSING="$MISSING $NAME"
        done
        if [ -n "$MISSING" ]; then
          echo "::notice title=Firefox Add-ons skipped::Not configured in store-release environment:$MISSING"
          echo "configured=false" >> "$GITHUB_OUTPUT"
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Download store packages
      if: steps.creds.outputs.configured == 'true'
      uses: actions/download-artifact@v7
      with:
        name: JA_Store_Packages_${{ needs.build.outputs.version }}
        path: store

    - name: Download source package
      if: steps.creds.outputs.configured == 'true'
      uses: actions/download-artifact@v7
      with:
        name: ${{ needs.build.outputs.src_name }}
        path: source

    - name: Archive source package
      if: steps.creds.outputs.configured == 'true'
      run: (cd source && zip -r -X -q "$GITHUB_WORKSPACE/ja-source.zip" .)

    - name: Checkout publish scripts
      if: steps.creds.outputs.configured == 'true'
      uses: actions/checkout@v7
      with:
        sparse-checkout: scripts/store-publish
        path: repo

    - name: Use Node.js 24.x
      if: steps.creds.outputs.configured == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 24.x

    - name: Publish to Firefox Add-ons
      if: steps.creds.outputs.configured == 'true'
      env:
        PACKAGE_PATH: store/ja-firefox-v${{ needs.build.outputs.version }}.zip
        SOURCE_PATH: ja-source.zip
        FIREFOX_APPROVAL_NOTES: Build environment and steps to reproduce the package are described in README.md of the attached source package.
        FIREFOX_ADDON_GUID: ${{ vars.FIREFOX_ADDON_GUID }}
        FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
        FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      run: node repo/scripts/store-publish/firefox.mjs

# This workflow will build Jira Assistant plugin and publish to Jira Cloud staging environment by default

name: Deploy Jira Cloud App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment to publish'
        default: 'staging'
        required: true
        type: choice
        options:
        - development
        - staging
        - production
      forgeEmail:
        description: 'Atlassian Email id'
        required: true
        type: string
      forgeApiToken:
        description: 'Atlassian API token'
        required: true
        type: string
      approveMajorVersion:
        description: 'Approve Forge major version (required when scopes or egress change; installed sites must re-consent)'
        default: false
        type: boolean
  push:
    branches: [ package, master ]
  pull_request:
    branches: [ package, master ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      CI: ""
      FORGE_ENV: staging
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_APPROVE_MAJOR_VERSION: ${{ vars.FORGE_APPROVE_MAJOR_VERSION == 'true' }}

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Set env based on branch
      run: |
        echo "FORGE_ENV=production" >> $GITHUB_ENV
      if: startsWith(github.ref, 'refs/heads/master')
      
    - name: Override env with user inputs
      run: |
        echo "FORGE_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
        echo "FORGE_EMAIL=${{ github.event.inputs.forgeEmail }}" >> $GITHUB_ENV
        echo "FORGE_API_TOKEN=${{ github.event.inputs.forgeApiToken }}" >> $GITHUB_ENV
        echo "FORGE_APPROVE_MAJOR_VERSION=${{ inputs.approveMajorVersion }}" >> $GITHUB_ENV
      if: startsWith(github.event_name, 'workflow_dispatch')
      
    - run: echo Deploying ${{github.ref}} to ${{env.FORGE_ENV}}
    - run: npm install -g @forge/cli@latest
    - run: npm install --force
    - run: npm run build-plugin
    - run: forge settings set usage-analytics false
    - name: Deploy to Forge
      run: |
        if [ "$FORGE_APPROVE_MAJOR_VERSION" = "true" ]; then
          forge deploy -e "$FORGE_ENV" --approve MAJOR_VERSION_RULE
        else
          forge deploy -e "$FORGE_ENV"
        fi
    - run: forge logout

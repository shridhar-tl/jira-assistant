# This workflow will build Jira Assistant plugin and publish to Jira Cloud staging environment by default

name: Deploy Jira Cloud App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment to publish'
        default: 'staging'
        required: true
        type: choice
        options:
        - development
        - staging
        - production
      approveMajorVersion:
        description: 'Approve Forge major version (required when scopes or egress change; installed sites must re-consent)'
        default: false
        type: boolean
  push:
    branches: [ package, master ]
    paths-ignore:
      - '**/package-lock.json'
      - '**/npm-shrinkwrap.json'
      - '**/pnpm-lock.yaml'
      - 'docs/**'
      - 'scripts/**'
  pull_request:
    branches: [ package, master ]
    paths-ignore:
      - '**/package-lock.json'
      - '**/npm-shrinkwrap.json'
      - '**/pnpm-lock.yaml'
      - 'docs/**'
      - 'scripts/**'

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CI: ""

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install --force
    - run: npm run build-plugin

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && format('forge-{0}', inputs.environment) || startsWith(github.ref, 'refs/heads/master') && 'forge-production' || 'forge-staging' }}
    env:
      CI: ""
      FORGE_ENV: staging
      FORGE_APPROVE_MAJOR_VERSION: ${{ vars.FORGE_APPROVE_MAJOR_VERSION == 'true' }}

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Set env based on branch
      run: |
        echo "FORGE_ENV=production" >> $GITHUB_ENV
      if: startsWith(github.ref, 'refs/heads/master')
      
    - name: Override env with user inputs
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_APPROVE_MAJOR_VERSION: ${{ inputs.approveMajorVersion }}
      run: |
        echo "FORGE_ENV=$INPUT_ENVIRONMENT" >> $GITHUB_ENV
        echo "FORGE_APPROVE_MAJOR_VERSION=$INPUT_APPROVE_MAJOR_VERSION" >> $GITHUB_ENV
      if: startsWith(github.event_name, 'workflow_dispatch')
      
    - run: echo "Deploying $GITHUB_REF to $FORGE_ENV"
    - run: npm install -g @forge/cli@latest
    - run: npm install --force
    - run: npm run build-plugin
    - run: forge settings set usage-analytics false
    - name: Deploy to Forge
      env:
        FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
        FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      run: |
        if [ "$FORGE_APPROVE_MAJOR_VERSION" = "true" ]; then
          forge deploy -e "$FORGE_ENV" --approve MAJOR_VERSION_RULE
        else
          forge deploy -e "$FORGE_ENV"
        fi
    - run: forge logout
      env:
        FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
        FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

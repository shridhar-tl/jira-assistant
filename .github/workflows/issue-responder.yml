name: Issue Responder

on:
  workflow_dispatch:
    inputs:
      ticket_number:
        description: 'Ticket Number'
        required: true
        type: integer
      ticket_type:
        description: 'Ticket Type'
        required: true
        type: choice
        options:
          - issues
          - discussions
        default: issues
      avoidUpdate:
        description: 'Do not update Resource center'
        required: false
        type: boolean
        default: false
      updateDocsOnly:
        description: 'Do not add comments to the ticket'
        required: false
        type: boolean
        default: false
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]

permissions:
  issues: write
  discussions: write
  statuses: write

concurrency:
  group: issue-responder-${{ github.event.issue.number || github.event.discussion.number || github.event.inputs.ticket_number }}
  cancel-in-progress: false

jobs:
  run-script:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor != 'github-actions[bot]' && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    env:
      RESP_BASE_PATH: ${{ vars.RESP_BASE_PATH }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download script
        run: |
          curl -fsSL -o github.mjs "${{ vars.RESPONDER_SCRIPT_URL || 'https://chat.utilsware.com/actions/github/github.mjs' }}"

      - name: Identify Action
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TICKET_TYPE=${{ github.event.inputs.ticket_type }}" >> $GITHUB_ENV
            echo "TICKET_NUMBER=${{ github.event.inputs.ticket_number }}" >> $GITHUB_ENV
          elif [[ "${{ github.event_name }}" == "discussion_comment" ]] || [[ "${{ github.event_name }}" == "discussion" ]]; then
            echo "TICKET_TYPE=discussions" >> $GITHUB_ENV
            echo "TICKET_NUMBER=${{ github.event.discussion.number }}" >> $GITHUB_ENV
          else
            echo "TICKET_TYPE=issues" >> $GITHUB_ENV
            echo "TICKET_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
          fi

      - name: Decide between reply and knowledge update
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || github.event.issue.author_association || github.event.discussion.author_association }}
        run: |
          UPDATE_ONLY=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.updateDocsOnly }}" == "true" ]]; then
              UPDATE_ONLY=true
            fi
          elif [[ "${{ github.event.action }}" == "edited" ]]; then
            echo "Content was edited. Updating the knowledge base without replying."
            UPDATE_ONLY=true
          elif [[ "$AUTHOR_ASSOCIATION" == "OWNER" || "$AUTHOR_ASSOCIATION" == "MEMBER" || "$AUTHOR_ASSOCIATION" == "COLLABORATOR" ]]; then
            echo "Content was posted by a maintainer ($AUTHOR_ASSOCIATION). Updating the knowledge base without replying."
            UPDATE_ONLY=true
          fi
          echo "UPDATE_ONLY=$UPDATE_ONLY" >> $GITHUB_ENV

      - name: Update knowledge base only
        if: env.UPDATE_ONLY == 'true'
        run: |
          node github.mjs --ticket "$TICKET_NUMBER" \
                --ticketType "$TICKET_TYPE" \
                --repo "${{ github.repository }}" \
                --orgId "${{ vars.RESPONDER_ORG_ID }}" \
                --botId "${{ vars.RESPONDER_BOT_ID }}" \
                --ghToken "${{ github.token }}" \
                --authToken "${{ secrets.RESPONDER_TOKEN }}" \
                --updateOnly

      - name: Add comment to ticket
        if: env.UPDATE_ONLY != 'true'
        run: |
          node github.mjs --testMode "${{ github.event.inputs.avoidUpdate || 'false' }}" \
                  --ticket "$TICKET_NUMBER" \
                  --ticketType "$TICKET_TYPE" \
                  --repo "${{ github.repository }}" \
                  --orgId "${{ vars.RESPONDER_ORG_ID }}" \
                  --botId "${{ vars.RESPONDER_BOT_ID }}" \
                  --ghToken "${{ github.token }}" \
                  --authToken "${{ secrets.RESPONDER_TOKEN }}"

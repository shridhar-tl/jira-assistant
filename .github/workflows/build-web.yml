name: Build & Deploy Web

on:
  workflow_dispatch:
  push:
    branches: [ package ]
    paths-ignore:
      - '**/package-lock.json'
      - '**/npm-shrinkwrap.json'
      - '**/pnpm-lock.yaml'
      - 'docs/**'
      - 'scripts/**'
  pull_request:
    branches: [ package ]
    paths-ignore:
      - '**/package-lock.json'
      - '**/npm-shrinkwrap.json'
      - '**/pnpm-lock.yaml'
      - 'docs/**'
      - 'scripts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: ""

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Install packages
      run: |
        rm -f package-lock.json
        npm install --force
    - run: npm run build-web
    - name: Deploy web
      if: github.event_name != 'pull_request'
      run: |
        git config --global user.name 'GitHub Web Deploy CI'
        git config --global user.email 'shridhar.tl@gmail.com'
        git remote set-url origin https://shridhar-tl:${{ secrets.COMMIT_KEY }}@github.com/${{ github.repository }}
        npm run deploy-web

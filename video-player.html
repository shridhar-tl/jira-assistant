<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <title>Jira Assistant - Video Help</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: #000;
            }
            iframe {
                display: block;
                width: 100%;
                height: 100%;
                border: 0;
            }
            p {
                margin: 40vh 16px 0;
                color: #ccc;
                font: 14px sans-serif;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <!-- Extension and desktop pages never send a Referer header, which YouTube requires for embeds.
             They frame this page instead so that the player is embedded from an https origin. -->
        <script>
            (function () {
                var params = new URLSearchParams(window.location.search);
                var videoId = params.get('v') || '';
                var startAt = parseInt(params.get('start') || '0', 10);

                if (!/^[\w-]{11}$/.test(videoId)) {
                    var message = document.createElement('p');
                    message.textContent = 'The requested video is not available.';
                    document.body.appendChild(message);
                    return;
                }

                var query = new URLSearchParams({
                    rel: '0',
                    autoplay: '1',
                    cc_load_policy: '1',
                    start: String(startAt > 0 ? startAt : 0),
                });

                var frame = document.createElement('iframe');
                frame.src = 'https://www.youtube.com/embed/' + videoId + '?' + query.toString();
                frame.title = 'YouTube video player';
                frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; gyroscope; picture-in-picture; web-share';
                frame.allowFullscreen = true;
                frame.referrerPolicy = 'strict-origin-when-cross-origin';
                document.body.appendChild(frame);
            })();
        </script>
    </body>
</html>
